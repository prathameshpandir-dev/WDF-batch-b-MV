    <meta charset="UTF-8">
    <title>Settings</title>

<body>

    <table width="100%" border="0" cellpadding="5">
        <tr>
            <td width="10%" align="center">
                <img src="images/logo.svg" alt="Logo" width="80" height="80">
            </td>
            <td align="center">
                <h1>THE BACKBENCHERS UNIVERSITY</h1>
                <h3>Student Portal</h3>
            </td>
        </tr>
    </table>
    
    <hr>

    <table width="100%" border="1" cellpadding="10" cellspacing="0" align="center">
        <tr align="center" bgcolor="#e0e0e0">
            <td><a href="index.html"><b>Home</b></a></td>
            <td><a href="profile.html"><b>Profile</b></a></td>
            <td><a href="attendance.html"><b>Attendance</b></a></td>
            <td><a href="academics.html"><b>Academics</b></a></td>
            <td><a href="timetable.html"><b>Timetable</b></a></td>
            <td><a href="assignments.html"><b>Assignments</b></a></td>
            <td><a href="fees.html"><b>Fees</b></a></td>
            <td><a href="library.html"><b>Library</b></a></td>
            <td><a href="placements.html"><b>Placements</b></a></td>
            <td><a href="settings.html"><b>Settings</b></a></td>
        </tr>
    </table>

    <hr>

    <fieldset>
        <legend><h2>Profile Settings</h2></legend>
        <form action="#" method="get">
            <table border="0" cellpadding="8">
                <tr>
                    <td><b>Email:</b></td>
                    <td><input type="email" id="edit-email" size="30" value="rahul.sharma@backbenchers.edu.in"></td>
                </tr>
                <tr>
                    <td><b>Phone:</b></td>
                    <td><input type="text" id="edit-phone" size="30" value="9876543210"></td>
                </tr>
                <tr>
                    <td><b>Address:</b></td>
                    <td><input type="text" id="edit-address" size="40" value="Hostel Room 12, Pune"></td>
                </tr>
                <tr>
                    <td></td>
                    <td><button type="submit">Save Changes</button></td>
                </tr>
            </table>
        </form>
    </fieldset>

    <br>

    <fieldset>
        <legend><h2>Change Password</h2></legend>
        <form action="#" method="get">
            <table border="0" cellpadding="8">
                <tr>
                    <td><b>Current Password:</b></td>
                    <td><input type="password" id="current-pass"></td>
                </tr>
                <tr>
                    <td><b>New Password:</b></td>
                    <td><input type="password" id="new-pass"></td>
                </tr>
                <tr>
                    <td><b>Confirm Password:</b></td>
                    <td><input type="password" id="confirm-pass"></td>
                </tr>
                <tr>
                    <td></td>
                    <td><button type="submit">Update Password</button></td>
                </tr>
            </table>
        </form>
    </fieldset>

    <br>

    <fieldset>
        <legend><h2>Notifications</h2></legend>
        <form action="#" method="get">
            <p><input type="checkbox" id="n1" checked> <label for="n1">Exam notifications</label></p>
            <p><input type="checkbox" id="n2" checked> <label for="n2">Fee reminders</label></p>
            <p><input type="checkbox" id="n3" checked> <label for="n3">Placement alerts</label></p>
            <button type="submit">Save</button>
        </form>
    </fieldset>

    <br>

    <fieldset>
        <legend><h2>Logout</h2></legend>
        <p>Click below to log out:</p>
        <form action="index.html" method="get">
            <button type="submit">Logout</button>
        </form>
    </fieldset>

</body>
</html>
